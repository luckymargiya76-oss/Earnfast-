<!DOCTYPE html>
<html lang="hi">
<head>

        .btn-logout { width: 100%; background: #FF3B30; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 20px; cursor: pointer; }

</head>

    <div class="card">

            <span id="user-email" style="color: #666; font-weight: bold;">test@user.com</span>
        </div>
    </div>

    <div class="card">
        <a href="mailto:your-email@gmail.com" class="menu-item">

        </a>
        <a href="#" class="menu-item">
            <span>📜 Terms & Conditions (नियम और शर्तें)</span>

        </a>

        </a>

</html>
